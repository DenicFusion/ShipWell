<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ShipWell — The World's Goods. Delivered With Precision.</title>
    <meta name="theme-color" content="#07090F" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Installable app (PWA) only on the admin host.
      if (/^admin\./i.test(location.hostname)) {
        var m = document.createElement("link");
        m.rel = "manifest";
        m.href = "/admin.webmanifest";
        document.head.appendChild(m);
        var cap = document.createElement("meta");
        cap.name = "apple-mobile-web-app-capable";
        cap.content = "yes";
        document.head.appendChild(cap);
        var t = document.createElement("meta");
        t.name = "apple-mobile-web-app-title";
        t.content = "SW Admin";
        document.head.appendChild(t);
      }
    </script>
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Global luxury logistics platform with live tracking, instant quotes, dual sender/receiver dashboards, and automated parcel alerts."
    />
    <meta
      property="og:title"
      content="ShipWell — The World's Goods. Delivered With Precision."
    />
    <meta
      property="og:description"
      content="Global luxury logistics platform with live tracking, instant quotes, dual sender/receiver dashboards, and automated parcel alerts."
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("sw_theme") || "system";
          var resolved =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              resolved === "light" ? "#F3F6FA" : "#07090F"
            );
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
